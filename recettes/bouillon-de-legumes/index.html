  <body class="page-recette">
    <a class="saut-au-contenu" href="#contenu">Aller au contenu</a>
    <header class="entete">
      <div class="entete__interieur">
        <a class="entete__marque" href="/recettes-site/">Recettes</a>

        <!--
          La recherche est en haut, sur toute page, et c'est un formulaire `GET`
          vers la page de recherche : les autres pages ne chargent pas le module de
          recherche, et un champ muet à la touche Entrée serait un piège. La page de
          recherche lit `?q=` à l'ouverture — ce qui rend une recherche partageable.
        -->
        <form class="entete__recherche" role="search" action="/recettes-site/recherche/" method="get">
          <label class="visuellement-cache" for="recherche-entete">Chercher une recette</label>
          <input
            class="entete__champ"
            id="recherche-entete"
            name="q"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Chercher une recette…"
          />
          <button class="entete__loupe" type="submit" aria-label="Chercher">⌕</button>
        </form>
      <nav class="entete__nav" aria-label="Navigation principale">
        <a href="/recettes-site/recherche/">Rechercher</a>
        <a href="/recettes-site/favoris/">Favoris</a>
      </nav>
      </div>
    </header>
    <main id="contenu" class="contenu">
      <article
  class="recette"
  data-slug="bouillon-de-legumes"
  data-base="1500"
  data-base-unite="ml"
  data-source-slugs-retires="/recettes-site/index/slugs-retires.json"
>
  

  <!--
    L'adresse voyage en attribut : la feuille d'impression l'ajoute au titre, pour
    qu'une feuille pliée dans un carnet mène encore à la fiche. Invisible à
    l'écran.
  -->
  <h1 class="recette__titre" data-url-impression="ronan-k.github.io/recettes-site/recettes/bouillon-de-legumes/">Bouillon de légumes</h1>
  <p class="recette__resume">Rendement 1500 ml · Préparation 15 min · Cuisson 45 min</p>
    <ul class="criteres">
    <li class="critere critere--allergene"><span class="critere__intitule">Allergènes</span> celeri</li>
    <li class="critere critere--regime"><span class="critere__intitule">Convient</span> vegetalien, vegetarien</li>
  </ul>

  <div class="recette__actions">
    <button type="button" class="bouton bouton--favori" data-role="favori" aria-pressed="false">
      ☆ Mettre en favori
    </button>
  </div>

  <!--
    Les deux sections portent une classe propre : en mode cuisine, l'une devient un
    panneau escamotable et l'autre prend tout l'écran. Sans ces classes, la feuille
    de style les désignerait par leur position, qu'une variante de gabarit
    changerait sans prévenir.
  -->
  <section class="recette__section recette__section--ingredients" aria-labelledby="titre-ingredients">
    <div class="recette__entete-section">
      <h2 id="titre-ingredients">Ingrédients</h2>
          <div class="echelle" role="group" aria-label="Rendement">
      <label class="echelle__label">
        <input class="echelle__champ" data-role="echelle" type="number" inputmode="numeric" min="150" step="150" value="1500" />
        <span class="echelle__intitule">ml</span>
      </label>
    </div>
    </div>
    <ul class="ingredients">
            <li class="ingredient" data-id="carotte" data-quantite="2" data-echelonnable="1" data-arrondi="1" data-unite="pièce" data-unite-pluriel="pièces"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte"><span class="ingredient__quantite" data-role="quantite">2 pièces</span> <span class="ingredient__nom">carotte</span></span></label></li>
      <li class="ingredient" data-id="poireau" data-quantite="1" data-echelonnable="1" data-arrondi="1" data-unite="pièce" data-unite-pluriel="pièces"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte"><span class="ingredient__quantite" data-role="quantite">1 pièce</span> <span class="ingredient__nom">poireau</span></span></label></li>
      <li class="ingredient" data-id="celeri-branche" data-quantite="1" data-echelonnable="1" data-arrondi="1" data-unite="pièce" data-unite-pluriel="pièces"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte"><span class="ingredient__quantite" data-role="quantite">1 pièce</span> <span class="ingredient__nom">céleri branche</span></span></label></li>
      <li class="ingredient" data-id="oignon-jaune" data-quantite="1" data-echelonnable="1" data-arrondi="1" data-unite="pièce" data-unite-pluriel="pièces"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte"><span class="ingredient__quantite" data-role="quantite">1 pièce</span> <span class="ingredient__nom">oignon jaune</span></span></label></li>
      <li class="ingredient" data-id="thym" data-quantite="1" data-echelonnable="0" data-arrondi="1" data-unite="pincée" data-unite-pluriel="pincées"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte"><span class="ingredient__quantite" data-role="quantite">1 pincée</span> <span class="ingredient__nom">thym</span></span></label></li>
      <li class="ingredient" data-id="laurier" data-quantite="1" data-echelonnable="0" data-arrondi="1" data-unite="pièce" data-unite-pluriel="pièces"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte"><span class="ingredient__quantite" data-role="quantite">1 pièce</span> <span class="ingredient__nom">laurier</span></span></label></li>
      <li class="ingredient" data-id="eau" data-quantite="1.8" data-echelonnable="1" data-arrondi="0.01" data-unite="litre" data-unite-pluriel="litres"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte"><span class="ingredient__quantite" data-role="quantite">1,8 litre</span> <span class="ingredient__nom">eau</span></span></label></li>
      <li class="ingredient" data-id="sel-fin" data-quantite="1" data-echelonnable="1" data-arrondi="0.5" data-unite="cuillère à café" data-unite-pluriel="cuillères à café"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte"><span class="ingredient__quantite" data-role="quantite">1 cuillère à café</span> <span class="ingredient__nom">sel fin</span></span></label></li>
    </ul>
    
  </section>

  <section class="recette__section recette__section--etapes" aria-labelledby="titre-etapes">
    <div class="recette__entete-section">
      <h2 id="titre-etapes">Préparation</h2>
            <button type="button" class="bouton bouton--cuisine" data-role="mode-cuisine">Mode cuisine</button>
    </div>
        <ol class="etapes" start="1">
      <li class="etape"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte">Laver et couper grossièrement les légumes.</span></label></li>
      <li class="etape"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte">Les mettre dans une grande casserole avec l&#39;eau froide, le thym et le laurier.</span></label></li>
      <li class="etape"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte">Porter à frémissement et laisser cuire 45 minutes à découvert.</span></label></li>
      <li class="etape"><label class="coche"><input class="coche__case" type="checkbox" data-role="coche" autocomplete="off" /><span class="coche__texte">Filtrer, saler, laisser refroidir avant de conserver.</span></label></li>
    </ol>
  </section>

  

    <div class="cuisine-entete">
    <p class="cuisine-entete__position" data-role="cuisine-position" aria-live="polite"></p>
    <button type="button" class="cuisine-entete__quitter" data-role="cuisine-quitter" aria-label="Quitter le mode cuisine">✕</button>
  </div>
  <div class="cuisine-barre" data-role="cuisine-barre">
    <p class="cuisine-barre__degradation" data-role="cuisine-degradation" role="status" hidden></p>
    <button type="button" class="bouton" data-role="cuisine-rearmer" hidden>Garder l'écran allumé</button>
    <div class="cuisine-barre__rangee">
      <button type="button" class="cuisine-barre__ingredients" data-role="cuisine-ingredients" aria-expanded="false">Ingrédients</button>
      <button type="button" class="cuisine-barre__bouton cuisine-barre__bouton--precedent" aria-label="Étape précédente" data-role="cuisine-precedent">‹ <span class="cuisine-barre__mot">Précédente</span></button>
      <button type="button" class="cuisine-barre__bouton cuisine-barre__bouton--suivant" data-role="cuisine-suivant">Suivante ›</button>
    </div>
  </div>
</article>

    </main>
    <footer class="pied">
      <p>Recettes — site statique, sans compte ni traceur.</p>
    </footer>
  </body>
</html>
